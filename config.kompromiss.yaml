    K12: "двенадцатый — «Память»"
    UND: "«без компромисса»"
  class_rows:                        # строки графика
    K1: "1. Порядок перечисления"
    K2: "2. Юбилейная заметка"
    K3: "3. Гостья"
    K4: "4. Букварь"
    K5: "5. Публикабельный младенец"
    K6: "6. Интересный человек"
    K7: "7. Выбор героя"
    K8: "8. Телеграмма"
    K9: "9. Моральная тема"
    K10: "10. Они мешают нам жить"
    K11: "11. Чужие похороны"
