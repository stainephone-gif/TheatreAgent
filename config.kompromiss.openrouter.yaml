# «Компромисс» через OpenRouter — проверка цикла одним ключом OPENROUTER_API_KEY (openrouter.ai/keys, в .env).
# Письмо, переписывание и классификация — Claude; чтение призрачных цитат — Llama 8B вместо GigaChat:
# маленькая модель «дочитывает» лишнее, Claude же копирует текст дословно и призраков не даёт.
#   python apophenia.py models --config config.kompromiss.openrouter.yaml   # точные имена моделей в каталоге
#   python apophenia.py probe  --config config.kompromiss.openrouter.yaml   # один фрагмент: сколько призраков даёт Llama
#   python apophenia.py once   --config config.kompromiss.openrouter.yaml --no-print
extends: config.kompromiss.yaml

llm:
  provider: openrouter
  providers: {ghosts: openrouter}    # все роли через OpenRouter (в основной конфигурации ghosts: gigachat)
  temperatures:
    ghosts: 1.0                      # температура идёт только Llama; у Claude сэмплирование запрещено
  openrouter:
    model: anthropic/claude-opus-5.5           # имена — как в каталоге OpenRouter (команда models)
    models:
      ghosts: meta-llama/llama-3.1-8b-instruct
    effort: {explicate: medium, rewrite: medium, classify: medium}
    max_tokens: 16000
    max_tokens_by_role: {ghosts: 3000}         # маленькой модели длинный ответ не нужен

paths:                               # отдельные папки, чтобы пробные листы не смешивались со спектаклем
  archive: archive_kompromiss_openrouter
  rejected: archive_kompromiss_openrouter/rejected
  queue: queue_kompromiss_openrouter
  state: state_kompromiss_openrouter
  logs: logs_kompromiss_openrouter
